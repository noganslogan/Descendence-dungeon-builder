<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf8f1" />
<title>Descendence Dungeon Draft</title>
<style>
  :root {
    --bg:#e6e1d6; --paper:#fffdf8; --ink:#1e1d1a; --muted:#777166;
    --line:#d4cec2; --accent:#7a5c20; --bar:#fbf8f1; --danger:#8c2d27;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input,textarea,select{font:inherit}
  button{color:var(--ink);touch-action:manipulation}
  [hidden]{display:none!important}
  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
  header{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
    padding-top:max(10px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line);z-index:4
  }
  header strong{font-size:13px;letter-spacing:.03em;white-space:nowrap}
  #status{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .mini{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 10px;color:var(--ink)}
  #workspace{position:relative;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#dcd7cc}
  #board-wrap{position:absolute;inset:0;background:white;box-shadow:inset 0 0 0 1px #c8c2b6}
  #board{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:white}
  #zoomControls{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:2px;
    padding:4px;background:rgba(251,248,241,.94);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 3px 14px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
  #zoomControls button{min-width:36px;height:36px;border:0;background:transparent;border-radius:7px;font-weight:700;padding:0 8px}
  #zoomControls button:active{background:#e9e3d8}
  #zoomLevel{min-width:50px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .floating-controls{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:5px;
    max-width:calc(100% - 210px);padding:5px;background:rgba(251,248,241,.95);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 3px 14px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
  .floating-controls .control-label{font-size:10px;color:var(--muted);padding:0 3px;white-space:nowrap}
  .segmented{display:flex;gap:2px;background:#ebe6dc;border-radius:7px;padding:2px}
  .segmented button,.floating-controls>.compact-action{height:32px;border:0;background:transparent;border-radius:6px;padding:0 9px;
    font-size:11px;font-weight:700;white-space:nowrap}
  .segmented button.active{background:white;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .floating-controls>.compact-action{background:var(--ink);color:white}
  #tunnelWidthModes{padding-left:5px;border-left:1px solid var(--line)}
  #toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 8px max(8px,env(safe-area-inset-bottom));
    background:var(--bar);border-top:1px solid var(--line);z-index:4}
  .tool{min-width:0;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;
    padding:10px 2px;font-size:11px;font-weight:650;white-space:nowrap}
  .tool.active{background:var(--ink);color:white;border-color:var(--ink)}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .18s ease;max-height:72dvh;overflow:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.15);padding:14px 14px max(14px,env(safe-area-inset-bottom))}
  #sheet.open{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--paper);padding-top:2px;z-index:1}
  .sheet-head strong{font-size:14px;flex:1}
  label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:10px;color:var(--ink)}
  textarea{min-height:88px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1;border:1px solid var(--line);background:white;border-radius:8px;padding:10px}
  .danger{color:var(--danger)!important}
  .hint{font-size:11px;line-height:1.45;color:var(--muted);margin:10px 0 0}
  #objectKind{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  #connectionWarning{font-size:12px;line-height:1.4;color:var(--danger);background:#f8e9e5;border:1px solid #e6c4bd;
    padding:9px 10px;border-radius:8px;margin:10px 0}
  .slider-row{display:grid;grid-template-columns:1fr 52px;align-items:center;gap:10px}
  .slider-row input[type="range"]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
  .slider-row output{text-align:center;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .marker-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .marker-choice{display:flex;align-items:center;gap:9px;min-height:48px;text-align:left;border:1px solid var(--line);background:white;
    border-radius:9px;padding:8px;font-size:12px;font-weight:600}
  .marker-glyph{width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
    font-size:14px;font-weight:800;flex:0 0 auto;background:#f7f3e8}
  #connectionText{font-size:13px;line-height:1.45;margin:2px 0 10px}
  #connectionProgress{font-size:11px;color:var(--muted);margin-bottom:10px}
  .connection-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .connection-choice{border:1px solid var(--line);background:white;border-radius:9px;padding:12px 8px;font-size:12px;font-weight:650}
  .connection-choice.primary{background:var(--ink);color:white;border-color:var(--ink)}
  #toast{position:fixed;top:max(70px,calc(env(safe-area-inset-top) + 54px));left:50%;transform:translate(-50%,-10px);z-index:20;
    opacity:0;pointer-events:none;background:#1e1d1a;color:white;border-radius:999px;padding:8px 12px;font-size:12px;
    transition:.18s ease;max-width:calc(100vw - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (min-width:700px){
    #toolbar{grid-template-columns:repeat(6,minmax(80px,110px));justify-content:center}
    .tool{font-size:12px}
    #sheet{left:50%;right:auto;width:min(520px,calc(100vw - 24px));transform:translate(-50%,105%);border:1px solid var(--line);border-bottom:0}
    #sheet.open{transform:translate(-50%,0)}
    .marker-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-width:430px){
    .floating-controls{max-width:calc(100% - 142px);overflow-x:auto;scrollbar-width:none}
    .floating-controls::-webkit-scrollbar{display:none}
    .floating-controls .control-label{display:none}
    .segmented button{padding:0 8px}
    #zoomLevel{display:none}
    #zoomControls button{min-width:33px;padding:0 7px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>DESCENDENCE</strong>
    <span id="status">Select, or choose a drawing tool.</span>
    <button class="mini" id="undoBtn">Undo</button>
    <button class="mini" id="moreBtn" aria-label="Dungeon menu">•••</button>
  </header>

  <main id="workspace" aria-label="Dungeon canvas">
    <div id="board-wrap">
      <svg id="board" role="application" aria-label="Dungeon drawing grid">
        <defs>
          <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0L0 0 0 24" fill="none" stroke="#eee9df" stroke-width="1"/>
          </pattern>
          <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
            <rect width="120" height="120" fill="url(#smallGrid)"/>
            <path d="M120 0L0 0 0 120" fill="none" stroke="#d8d2c5" stroke-width="1.5"/>
          </pattern>
          <pattern id="hallwayHatch" width="9" height="9" patternUnits="userSpaceOnUse">
            <rect width="9" height="9" fill="#e4d5b7"/>
            <path d="M-3 9L9-3M1 13L13 1" fill="none" stroke="#b69f76" stroke-width="1.35" opacity=".72"/>
          </pattern>
        </defs>
        <rect id="canvasBg" fill="url(#grid)" pointer-events="none"/>
        <g id="structures"></g>
        <g id="connections"></g>
        <g id="details"></g>
        <g id="handles"></g>
        <g id="preview" pointer-events="none"></g>
      </svg>
    </div>
    <div id="zoomControls" aria-label="Canvas zoom controls">
      <button id="zoomOutBtn" aria-label="Zoom out">−</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn" aria-label="Zoom in">+</button>
      <button id="fitBtn">Fit</button>
    </div>
    <div id="drawModeControls" class="floating-controls" aria-label="Drawing shape controls" hidden>
      <span class="control-label" id="drawModeLabel">Shape</span>
      <div class="segmented" id="roomModes" hidden>
        <button type="button" data-room-mode="rectangle">Rectangle</button>
        <button type="button" data-room-mode="cavern">Cavern</button>
      </div>
      <div class="segmented" id="hallwayModes" hidden>
        <button type="button" data-hallway-mode="block">Block</button>
        <button type="button" data-hallway-mode="tunnel">Tunnel</button>
      </div>
      <div class="segmented" id="tunnelWidthModes" aria-label="Tunnel width" hidden>
        <button type="button" data-tunnel-width="0.75" aria-label="Narrow tunnel">¾×</button>
        <button type="button" data-tunnel-width="1.25" aria-label="Standard tunnel">1¼×</button>
        <button type="button" data-tunnel-width="2" aria-label="Wide tunnel">2×</button>
      </div>
    </div>
    <div id="shapeEditControls" class="floating-controls" aria-label="Shape editing controls" hidden>
      <span class="control-label">Drag the highlighted points</span>
      <button type="button" class="compact-action" id="finishShapeEditBtn">Done Editing</button>
    </div>
  </main>

  <nav id="toolbar" aria-label="Drawing tools">
    <button class="tool active" data-tool="select">Select</button>
    <button class="tool" data-tool="room">Room</button>
    <button class="tool" data-tool="hallway">Hallway</button>
    <button class="tool" data-tool="door">Door</button>
    <button class="tool" data-tool="marker">Marker</button>
    <button class="tool" data-tool="erase">Erase</button>
  </nav>
</div>

<section id="sheet" aria-live="polite">
  <div class="sheet-head">
    <strong id="sheetTitle">Dungeon</strong>
    <button class="mini" id="closeSheet">Close</button>
  </div>

  <div id="objectEditor" hidden>
    <div id="objectKind"></div>
    <div id="connectionWarning" hidden></div>
    <label for="labelField">LABEL</label>
    <input id="labelField" placeholder="Room 1, north gate, boss chamber..." />
    <label for="notesField">NOTES</label>
    <textarea id="notesField" placeholder="Notes for yourself or Claude..."></textarea>
    <div id="tunnelWidthEditor" hidden>
      <label for="tunnelWidthField">TUNNEL WIDTH</label>
      <div class="slider-row">
        <input id="tunnelWidthField" type="range" min="0.5" max="3" step="0.25" value="1.25" />
        <output id="tunnelWidthValue" for="tunnelWidthField">1.25×</output>
      </div>
    </div>
    <p class="hint">To move: close this panel, select the object, then drag it. On touch, hold briefly before dragging.</p>
    <div class="row">
      <button id="rotateBtn">Rotate Door</button>
      <button id="editShapeBtn" hidden>Edit Shape</button>
      <button class="danger" id="deleteBtn">Delete</button>
    </div>
  </div>

  <div id="markerPicker" hidden>
    <p class="hint" style="margin:0 0 10px">Choose a marker, then tap the grid to place it.</p>
    <div class="marker-grid" id="markerGrid"></div>
  </div>

  <div id="connectionPicker" hidden>
    <div id="connectionProgress"></div>
    <p id="connectionText"></p>
    <div class="connection-grid">
      <button class="connection-choice primary" data-connection-choice="open-passage">Open Passage</button>
      <button class="connection-choice" data-connection-choice="door">Door</button>
      <button class="connection-choice" data-connection-choice="secret-door">Secret Door</button>
      <button class="connection-choice" data-connection-choice="separate">Keep Separate</button>
    </div>
  </div>

  <div id="menu">
    <div class="row">
      <button id="copyBtn">Copy Claude JSON</button>
      <button id="downloadBtn">Download JSON</button>
    </div>
    <div class="row">
      <button id="importBtn">Import JSON</button>
      <button class="danger" id="clearBtn">Clear Dungeon</button>
    </div>
    <input id="fileInput" type="file" accept=".json,application/json" hidden />
  </div>
</section>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  const GRID=24;
  const STORAGE_V4='descendenceDungeonDraftV4';
  const STORAGE_V3='descendenceDungeonDraftV3';
  const STORAGE_V2='descendenceDungeonDraftV2';
  const MIN_ZOOM=.25;
  const MAX_ZOOM=3;
  const EPS=.75;

  const markerCatalog={
    monster:{label:'Monster',glyph:'M'},
    boss:{label:'Boss',glyph:'B'},
    treasure:{label:'Treasure',glyph:'◇'},
    trap:{label:'Trap',glyph:'△'},
    poi:{label:'Puzzle / Point of Interest',glyph:'?'},
    npc:{label:'NPC',glyph:'N'},
    key:{label:'Key / Important Item',glyph:'K'},
    'stairs-up':{label:'Stairs Up',glyph:'↑'},
    'stairs-down':{label:'Stairs Down',glyph:'↓'},
    'secret-door':{label:'Secret Door',glyph:'S'},
    objective:{label:'Objective / Important Location',glyph:'★'},
    entrance:{label:'Entrance / Exit',glyph:'E'}
  };

  const board=document.getElementById('board');
  const canvasBg=document.getElementById('canvasBg');
  const structuresLayer=document.getElementById('structures');
  const connectionsLayer=document.getElementById('connections');
  const detailsLayer=document.getElementById('details');
  const handlesLayer=document.getElementById('handles');
  const previewLayer=document.getElementById('preview');
  const workspace=document.getElementById('workspace');
  const status=document.getElementById('status');
  const sheet=document.getElementById('sheet');
  const sheetTitle=document.getElementById('sheetTitle');
  const objectEditor=document.getElementById('objectEditor');
  const markerPicker=document.getElementById('markerPicker');
  const connectionPicker=document.getElementById('connectionPicker');
  const menu=document.getElementById('menu');
  const labelField=document.getElementById('labelField');
  const notesField=document.getElementById('notesField');
  const objectKind=document.getElementById('objectKind');
  const connectionWarning=document.getElementById('connectionWarning');
  const rotateBtn=document.getElementById('rotateBtn');
  const editShapeBtn=document.getElementById('editShapeBtn');
  const drawModeControls=document.getElementById('drawModeControls');
  const shapeEditControls=document.getElementById('shapeEditControls');
  const roomModes=document.getElementById('roomModes');
  const hallwayModes=document.getElementById('hallwayModes');
  const tunnelWidthModes=document.getElementById('tunnelWidthModes');
  const tunnelWidthEditor=document.getElementById('tunnelWidthEditor');
  const tunnelWidthField=document.getElementById('tunnelWidthField');
  const tunnelWidthValue=document.getElementById('tunnelWidthValue');
  const toast=document.getElementById('toast');
  const zoomLevel=document.getElementById('zoomLevel');

  let state=createEmptyState();
  let viewport={x:-GRID*2,y:-GRID*2,zoom:1};
  let tool='select';
  let selectedId=null;
  let activeMarkerType='monster';
  let doorOrientation='horizontal';
  let roomDrawMode='rectangle';
  let hallwayDrawMode='block';
  let activeTunnelWidth=1.25;
  let editingShapeId=null;
  let history=[];
  let gesture=null;
  let pointers=new Map();
  let longPressTimer=null;
  let connectionQueue=[];
  let connectionQueueTotal=0;
  let editorHistorySaved=false;
  let toastTimer=null;
  let autosaveTimer=null;

  function createEmptyState(){
    return {
      schemaVersion:4,
      meta:{title:'Untitled Dungeon'},
      floors:[{id:'ground',name:'Ground',order:0}],
      activeFloorId:'ground',
      objects:[],connections:[],nextId:1,nextConnectionId:1
    };
  }

  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  const snap=n=>Math.round(n/GRID)*GRID;
  const sameId=(a,b)=>String(a)===String(b);
  const deepClone=value=>JSON.parse(JSON.stringify(value));
  const getObject=id=>state.objects.find(o=>sameId(o.id,id))||null;
  const selected=()=>getObject(selectedId);
  const activeFloorObjects=()=>state.objects.filter(o=>o.floorId===state.activeFloorId);
  const isStructural=o=>o&&(o.type==='room'||o.type==='hallway');
  const isPathHallway=o=>o?.type==='hallway'&&Array.isArray(o.points);
  const isOutlineRoom=o=>o?.type==='room'&&Array.isArray(o.points);
  const isEditableShape=o=>isPathHallway(o)||isOutlineRoom(o);
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const snapHalf=n=>Math.round(n/(GRID/2))*(GRID/2);
  const toPoint=point=>Array.isArray(point)?{x:point[0],y:point[1]}:{x:point.x,y:point.y};
  const toArray=point=>Array.isArray(point)?[point[0],point[1]]:[point.x,point.y];

  function normalizeAngle(value){
    const angle=normalizeNumber(value,0)%180;
    return angle<0?angle+180:angle;
  }

  function orientationFromAngle(angle){
    const normalized=normalizeAngle(angle);
    return normalized>=45&&normalized<135?'vertical':'horizontal';
  }

  function angleDifference(first,second){
    const difference=Math.abs(normalizeAngle(first)-normalizeAngle(second));
    return Math.min(difference,180-difference);
  }

  function svgEl(tag,attrs={}){
    const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
    Object.entries(attrs).forEach(([key,value])=>{
      if(value!==undefined&&value!==null)el.setAttribute(key,String(value));
    });
    return el;
  }

  function flash(message,duration=1500){
    clearTimeout(toastTimer);
    toast.textContent=message;
    toast.classList.add('show');
    toastTimer=setTimeout(()=>toast.classList.remove('show'),duration);
  }

  function scheduleAutosave(){
    clearTimeout(autosaveTimer);
    autosaveTimer=setTimeout(()=>{
      try{localStorage.setItem(STORAGE_V4,JSON.stringify({...state,viewport}))}catch{}
    },120);
  }

  function saveHistory(){
    history.push(JSON.stringify(state));
    if(history.length>80)history.shift();
  }

  function nextId(){return state.nextId++}
  function nextConnectionId(){return state.nextConnectionId++}

  function normalizeNumber(value,fallback=0){
    const number=Number(value);
    return Number.isFinite(number)?number:fallback;
  }

  function gridCoordinate(raw,axis){
    const gp=raw.gridPosition||raw.position;
    if(gp&&typeof gp==='object'){
      const key=axis==='x'?'column':'row';
      if(Number.isFinite(Number(gp[key])))return Number(gp[key])*GRID;
      if(Number.isFinite(Number(gp[axis])))return Number(gp[axis])*GRID;
    }
    return normalizeNumber(raw[axis]);
  }

  function normalizedPointList(raw){
    const geometry=raw.geometry&&typeof raw.geometry==='object'?raw.geometry:null;
    if(Array.isArray(raw.points))return raw.points.map(point=>{
      const value=toPoint(point);
      return [normalizeNumber(value.x),normalizeNumber(value.y)];
    });
    const gridPoints=Array.isArray(geometry?.points)?geometry.points:
      Array.isArray(geometry?.gridPath)?geometry.gridPath:
      Array.isArray(raw.gridPath)?raw.gridPath:
      Array.isArray(raw.gridOutline)?raw.gridOutline:null;
    if(!gridPoints)return null;
    return gridPoints.map(point=>{
      const value=toPoint(point);
      const column=point.column??value.x;
      const row=point.row??value.y;
      return [normalizeNumber(column)*GRID,normalizeNumber(row)*GRID];
    });
  }

  function normalizeObject(raw,fallbackId){
    if(!raw||typeof raw!=='object')return null;
    let type=raw.type==='corridor'?'hallway':raw.type;
    if(!['room','hallway','door','marker'].includes(type))return null;
    const common={
      id:raw.id??fallbackId,
      type,
      floorId:raw.floorId||raw.floor||'ground',
      label:typeof raw.label==='string'?raw.label:'',
      notes:typeof raw.notes==='string'?raw.notes:''
    };
    if(type==='room'||type==='hallway'){
      const geometry=raw.geometry&&typeof raw.geometry==='object'?raw.geometry:{};
      const rawPath=normalizedPointList(raw);
      const geometryKind=geometry.kind||raw.shape;
      if(type==='hallway'&&rawPath&&rawPath.length>=2){
        const smoothing=geometry.smoothing||raw.smoothing;
        const curved=smoothing==='curve'||smoothing==='catmull-rom'||raw.pathStyle==='curved'||raw.subtype==='mine-tunnel'||raw.subtype==='natural-tunnel';
        return {...common,shape:'path',subtype:raw.subtype||'passage',points:rawPath,
          pathStyle:curved?'curved':'constructed',smoothing:curved?'curve':'none',
          widthCells:clamp(normalizeNumber(geometry.widthCells??raw.widthCells,curved?1.25:.75),.5,4)};
      }
      if(type==='room'&&rawPath&&rawPath.length>=3&&(geometryKind==='outline'||raw.subtype==='cavern'||raw.shape==='outline')){
        return {...common,shape:'outline',subtype:raw.subtype||'cavern',points:rawPath,
          smoothing:geometry.smoothing||raw.smoothing||'curve'};
      }
      const origin=geometry.origin||geometry.gridPosition;
      const size=geometry.size||geometry.dimensions;
      let x=origin?normalizeNumber(origin.column??origin.x)*GRID:gridCoordinate(raw,'x');
      let y=origin?normalizeNumber(origin.row??origin.y)*GRID:gridCoordinate(raw,'y');
      let w=size?normalizeNumber(size.widthCells??size.width,1)*GRID:
        raw.dimensions?normalizeNumber(raw.dimensions.widthCells)*GRID:normalizeNumber(raw.w??raw.width,GRID);
      let h=size?normalizeNumber(size.heightCells??size.height,1)*GRID:
        raw.dimensions?normalizeNumber(raw.dimensions.heightCells)*GRID:normalizeNumber(raw.h??raw.height,GRID);
      if(w<0){x+=w;w=Math.abs(w)}
      if(h<0){y+=h;h=Math.abs(h)}
      return {...common,shape:'rect',subtype:raw.subtype||null,x,y,w:Math.max(GRID,w),h:Math.max(GRID,h)};
    }
    if(type==='door'){
      const angle=normalizeAngle(raw.angleDegrees??raw.angle??(raw.orientation==='vertical'?90:0));
      return {...common,x:gridCoordinate(raw,'x'),y:gridCoordinate(raw,'y'),angle,
        orientation:orientationFromAngle(angle),
        doorType:raw.doorType||raw.kind||'door',connectionId:raw.connectionId??null,
        generatedByConnection:Boolean(raw.generatedByConnection)};
    }
    const markerType=markerCatalog[raw.markerType]?raw.markerType:'poi';
    return {...common,x:gridCoordinate(raw,'x'),y:gridCoordinate(raw,'y'),markerType,
      targetFloorId:raw.targetFloorId??null};
  }

  function normalizeConnection(raw,fallbackId){
    if(!raw||typeof raw!=='object')return null;
    const gp=raw.gridPosition||raw.position||{};
    const x=Number.isFinite(Number(gp.column))?Number(gp.column)*GRID:normalizeNumber(gp.x);
    const y=Number.isFinite(Number(gp.row))?Number(gp.row)*GRID:normalizeNumber(gp.y);
    const type=['open-passage','door','secret-door'].includes(raw.type)?raw.type:'open-passage';
    const angle=normalizeAngle(raw.angleDegrees??raw.angle??(raw.orientation==='vertical'?90:0));
    return {
      id:raw.id??fallbackId,
      type,
      floorId:raw.floorId||raw.floor||'ground',
      fromObjectId:raw.fromObjectId??raw.from?.objectId,
      toObjectId:raw.toObjectId??raw.to?.objectId,
      position:{x,y},
      angle,orientation:orientationFromAngle(angle),contact:raw.contact||'threshold',
      doorObjectId:raw.doorObjectId??null,
      status:raw.status==='invalid'?'invalid':'valid',
      reason:typeof raw.reason==='string'?raw.reason:''
    };
  }

  function normalizeState(raw){
    const input=raw&&typeof raw==='object'?raw:{};
    const container=input.dungeon&&!Array.isArray(input.dungeon)?input.dungeon:input;
    const objectSource=Array.isArray(input.dungeon)?input.dungeon:Array.isArray(container.objects)?container.objects:
      Array.isArray(input.objects)?input.objects:[];
    const objects=objectSource.map((o,index)=>normalizeObject(o,index+1)).filter(Boolean);
    const objectIds=new Set(objects.map(o=>String(o.id)));
    const connectionSource=Array.isArray(container.connections)?container.connections:Array.isArray(input.connections)?input.connections:[];
    const connections=connectionSource.map((c,index)=>normalizeConnection(c,index+1)).filter(c=>c&&
      objectIds.has(String(c.fromObjectId))&&objectIds.has(String(c.toObjectId)));
    const floorsSource=Array.isArray(container.floors)?container.floors:Array.isArray(input.floors)?input.floors:[];
    const floorIds=new Set(objects.map(o=>o.floorId));
    const floors=floorsSource.length?floorsSource.map((f,index)=>({
      id:f.id||`floor-${index+1}`,name:f.name||f.label||`Floor ${index+1}`,order:normalizeNumber(f.order,index)
    })):[{id:'ground',name:'Ground',order:0}];
    floorIds.forEach(id=>{if(!floors.some(f=>f.id===id))floors.push({id,name:id,order:floors.length})});
    const numericObjectIds=objects.map(o=>Number(o.id)).filter(Number.isFinite);
    const numericConnectionIds=connections.map(c=>Number(c.id)).filter(Number.isFinite);
    const nextObject=Math.max(0,...numericObjectIds)+1;
    const nextConnection=Math.max(0,...numericConnectionIds)+1;
    const activeFloorId=container.activeFloorId||input.activeFloorId||floors[0].id;
    const normalized={
      schemaVersion:4,
      meta:{title:container.meta?.title||input.meta?.title||container.title||'Untitled Dungeon'},
      floors,
      activeFloorId:floors.some(f=>f.id===activeFloorId)?activeFloorId:floors[0].id,
      objects,connections,
      nextId:Math.max(normalizeNumber(container.nextId??input.nextId,nextObject),nextObject),
      nextConnectionId:Math.max(normalizeNumber(container.nextConnectionId??input.nextConnectionId,nextConnection),nextConnection)
    };
    const savedViewport=input.viewport||container.viewport;
    const normalizedViewport=savedViewport?{
      x:normalizeNumber(savedViewport.x,-GRID*2),y:normalizeNumber(savedViewport.y,-GRID*2),
      zoom:clamp(normalizeNumber(savedViewport.zoom,1),MIN_ZOOM,MAX_ZOOM)
    }:null;
    return {state:normalized,viewport:normalizedViewport};
  }

  function load(){
    for(const key of [STORAGE_V4,STORAGE_V3,STORAGE_V2]){
      try{
        const raw=localStorage.getItem(key);
        if(!raw)continue;
        const normalized=normalizeState(JSON.parse(raw));
        state=normalized.state;
        if(normalized.viewport)viewport=normalized.viewport;
        return;
      }catch{}
    }
  }

  function objectDisplayName(object){
    if(!object)return 'Object';
    if(object.label.trim())return object.label.trim();
    if(isPathHallway(object)&&object.pathStyle==='curved')return `Tunnel ${object.id}`;
    if(isOutlineRoom(object))return `Cavern ${object.id}`;
    if(object.type==='hallway')return `Hallway ${object.id}`;
    if(object.type==='room')return `Room ${object.id}`;
    if(object.type==='door')return `${object.doorType==='secret-door'?'Secret Door':'Door'} ${object.id}`;
    return `${markerCatalog[object.markerType]?.label||'Marker'} ${object.id}`;
  }

  function typeDisplayName(object){
    if(!object)return 'Object';
    if(isPathHallway(object)&&object.pathStyle==='curved')return 'Curved Tunnel';
    if(isOutlineRoom(object))return 'Cavern';
    if(object.type==='hallway')return 'Hallway';
    if(object.type==='room')return 'Room';
    if(object.type==='door')return object.doorType==='secret-door'?'Secret Door':'Door';
    return markerCatalog[object.markerType]?.label||'Marker';
  }

  function showSheetSection(section,title){
    [objectEditor,markerPicker,connectionPicker,menu].forEach(el=>el.hidden=el!==section);
    sheetTitle.textContent=title;
    sheet.classList.add('open');
  }

  function forceCloseSheet(){sheet.classList.remove('open')}
  function closeSheet(){
    if(connectionQueue.length){flash('Choose how these areas connect first');return}
    forceCloseSheet();
  }

  function openObjectSheet(){
    const object=selected();
    if(!object)return;
    editorHistorySaved=false;
    objectKind.textContent=typeDisplayName(object);
    labelField.value=object.label||'';
    notesField.value=object.notes||'';
    rotateBtn.hidden=object.type!=='door';
    editShapeBtn.hidden=!isEditableShape(object);
    editShapeBtn.textContent=isOutlineRoom(object)?'Edit Outline':'Edit Path';
    tunnelWidthEditor.hidden=!isPathHallway(object);
    if(isPathHallway(object)){
      tunnelWidthField.value=String(object.widthCells||.75);
      tunnelWidthValue.textContent=`${Number(tunnelWidthField.value).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}×`;
    }
    const related=state.connections.filter(c=>sameId(c.fromObjectId,object.id)||sameId(c.toObjectId,object.id)||sameId(c.doorObjectId,object.id));
    const invalid=related.filter(c=>c.status==='invalid');
    connectionWarning.hidden=!invalid.length;
    connectionWarning.textContent=invalid.length?`${invalid.length} connection${invalid.length===1?'':'s'} need attention. Move the connected geometry back together or delete/rebuild the connection.`:'';
    showSheetSection(objectEditor,objectDisplayName(object));
  }

  function openMenu(){showSheetSection(menu,'Dungeon')}

  function openMarkerPicker(){

  }

  function buildMarkerPicker(){
    const grid=document.getElementById('markerGrid');
    grid.innerHTML='';
    Object.entries(markerCatalog).forEach(([key,item])=>{
      const button=document.createElement('button');
      button.className='marker-choice';
      button.type='button';
      button.dataset.markerType=key;
      const glyph=document.createElement('span');
      glyph.className='marker-glyph';
      glyph.textContent=item.glyph;
      const text=document.createElement('span');
      text.textContent=item.label;
      button.append(glyph,text);
      button.addEventListener('click',()=>{
        activeMarkerType=key;
        setTool('marker');
        forceCloseSheet();
        flash(`${item.label} marker ready`);
      });
      grid.appendChild(button);
    });

  function updateDrawingControls(){

  function updateToolStatus(){
    if(editingShapeId!==null){status.textContent='Drag a highlighted point to reshape. Tap Done Editing when finished.';return}
    const roomMessage=roomDrawMode==='cavern'?'Trace a cavern outline. Release to close it.':'Drag to make a room. Use two fingers to zoom.';
    const hallwayMessage=hallwayDrawMode==='tunnel'?'Draw a winding tunnel. Release to finish it.':'Drag to make a hallway. Use two fingers to zoom.';
    const messages={
      select:'Drag empty space to pan. Tap an object to select it.',
      room:roomMessage,

  function setTool(nextTool,preserveEditing=false){
    clearLongPress();
    gesture=null;
    previewLayer.innerHTML='';
    if(!preserveEditing)editingShapeId=null;
    tool=nextTool;
    document.querySelectorAll('[data-tool]').forEach(button=>button.classList.toggle('active',button.dataset.tool===tool));
    updateDrawingControls();

  function updateViewport(){
    const width=Math.max(1,workspace.clientWidth);
    const height=Math.max(1,workspace.clientHeight);
    board.setAttribute('viewBox',`${viewport.x} ${viewport.y} ${width/viewport.zoom} ${height/viewport.zoom}`);
    const margin=Math.max(2400,width/viewport.zoom*2,height/viewport.zoom*2);
    canvasBg.setAttribute('x',viewport.x-margin);
    canvasBg.setAttribute('y',viewport.y-margin);
    canvasBg.setAttribute('width',width/viewport.zoom+margin*2);
    canvasBg.setAttribute('height',height/viewport.zoom+margin*2);
    zoomLevel.textContent=`${Math.round(viewport.zoom*100)}%`;
    renderEditHandles();
  }

  function worldPoint(clientX,clientY,snapToGrid=true){
    const rect=board.getBoundingClientRect();
    const point={
      x:viewport.x+(clientX-rect.left)/viewport.zoom,
      y:viewport.y+(clientY-rect.top)/viewport.zoom
    };
    return snapToGrid?{x:snap(point.x),y:snap(point.y)}:point;
  }

  function setZoomAt(nextZoom,clientX,clientY,anchor=null){
    const zoom=clamp(nextZoom,MIN_ZOOM,MAX_ZOOM);
    const rect=board.getBoundingClientRect();
    const localX=clientX-rect.left,localY=clientY-rect.top;
    const worldAnchor=anchor||worldPoint(clientX,clientY,false);
    viewport.zoom=zoom;
    viewport.x=worldAnchor.x-localX/zoom;
    viewport.y=worldAnchor.y-localY/zoom;
    updateViewport();
    scheduleAutosave();
  }

  function zoomFromCenter(multiplier){
    const rect=board.getBoundingClientRect();
    setZoomAt(viewport.zoom*multiplier,rect.left+rect.width/2,rect.top+rect.height/2);
  }

  function curvePathData(points,closed=false){
    const values=points.map(toPoint);
    if(!values.length)return '';
    if(values.length<3){
      const lines=values.slice(1).map(point=>`L ${point.x} ${point.y}`).join(' ');
      return `M ${values[0].x} ${values[0].y} ${lines}${closed?' Z':''}`;
    }
    let data=`M ${values[0].x} ${values[0].y}`;
    const count=closed?values.length:values.length-1;
    for(let index=0;index<count;index++){
      const p0=closed?values[(index-1+values.length)%values.length]:values[Math.max(0,index-1)];
      const p1=values[index];
      const p2=closed?values[(index+1)%values.length]:values[index+1];
      const p3=closed?values[(index+2)%values.length]:values[Math.min(values.length-1,index+2)];
      const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6};
      const c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
      data+=` C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p2.x} ${p2.y}`;
    }
    return `${data}${closed?' Z':''}`;
  }

  function catmullRomPoint(p0,p1,p2,p3,t){
    const t2=t*t,t3=t2*t;
    return {
      x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
      y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
    };
  }

  function sampledObjectPoints(object,steps=8){
    const values=(object.points||[]).map(toPoint);
    const curved=object.smoothing==='curve'||object.smoothing==='catmull-rom'||object.pathStyle==='curved';
    const closed=isOutlineRoom(object);
    if(!curved||values.length<3)return values;
    const sampled=[];
    const count=closed?values.length:values.length-1;
    for(let index=0;index<count;index++){
      const p0=closed?values[(index-1+values.length)%values.length]:values[Math.max(0,index-1)];
      const p1=values[index];
      const p2=closed?values[(index+1)%values.length]:values[index+1];
      const p3=closed?values[(index+2)%values.length]:values[Math.min(values.length-1,index+2)];
      for(let step=0;step<steps;step++)sampled.push(catmullRomPoint(p0,p1,p2,p3,step/steps));
    }
    if(!closed)sampled.push(values[values.length-1]);
    return sampled;
  }

  function pointToSegmentDistance(point,start,end){
    const dx=end.x-start.x,dy=end.y-start.y;
    if(dx===0&&dy===0)return distance(point,start);
    const t=clamp(((point.x-start.x)*dx+(point.y-start.y)*dy)/(dx*dx+dy*dy),0,1);
    return distance(point,{x:start.x+t*dx,y:start.y+t*dy});
  }

  function simplifyPoints(points,tolerance){
    if(points.length<=2)return points.slice();
    let greatest=0,index=0;
    for(let cursor=1;cursor<points.length-1;cursor++){
      const amount=pointToSegmentDistance(points[cursor],points[0],points[points.length-1]);
      if(amount>greatest){greatest=amount;index=cursor}
    }
    if(greatest<=tolerance)return [points[0],points[points.length-1]];
    const first=simplifyPoints(points.slice(0,index+1),tolerance);
    const second=simplifyPoints(points.slice(index),tolerance);
    return first.slice(0,-1).concat(second);
  }

  function cleanDrawnPoints(points,closed=false){
    let values=points.map(toPoint);
    if(closed&&values.length>2&&distance(values[0],values[values.length-1])<GRID)values=values.slice(0,-1);
    values=simplifyPoints(values,Math.max(4,6/viewport.zoom));
    values=values.map(point=>({x:snapHalf(point.x),y:snapHalf(point.y)})).filter((point,index,array)=>
      !index||distance(point,array[index-1])>=GRID/3);
    const maximum=48;
    if(values.length>maximum){
      const stride=(values.length-1)/(maximum-1);
      values=Array.from({length:maximum},(_,index)=>values[Math.round(index*stride)]);
    }
    if(closed&&values.length>2&&distance(values[0],values[values.length-1])<GRID/2)values.pop();
    return values.map(toArray);
  }

  function polylineLength(points,closed=false){
    const values=points.map(toPoint);
    let total=0;
    for(let index=1;index<values.length;index++)total+=distance(values[index-1],values[index]);
    if(closed&&values.length>2)total+=distance(values[values.length-1],values[0]);
    return total;
  }

  function polygonArea(points){
    const values=points.map(toPoint);
    return Math.abs(values.reduce((sum,point,index)=>{
      const next=values[(index+1)%values.length];
      return sum+point.x*next.y-next.x*point.y;
    },0)/2);
  }

  function segmentsFor(points,closed=false){
    const values=points.map(toPoint),segments=[];
    const count=closed?values.length:Math.max(0,values.length-1);
    for(let index=0;index<count;index++){
      const start=values[index],end=values[(index+1)%values.length];
      if(distance(start,end)<.01)continue;
      segments.push({start,end,angle:normalizeAngle(Math.atan2(end.y-start.y,end.x-start.x)*180/Math.PI)});
    }
    return segments;
  }

  function nearestOnPolyline(point,points,closed=false){
    let best=null;
    segmentsFor(points,closed).forEach((segment,index)=>{
      const dx=segment.end.x-segment.start.x,dy=segment.end.y-segment.start.y;
      const t=clamp(((point.x-segment.start.x)*dx+(point.y-segment.start.y)*dy)/(dx*dx+dy*dy),0,1);
      const position={x:segment.start.x+t*dx,y:segment.start.y+t*dy};
      const amount=distance(point,position);
      if(!best||amount<best.distance)best={position,distance:amount,tangentAngle:segment.angle,segmentIndex:index,t};
    });
    return best;
  }

  function pointInPolygon(point,points){
    const values=points.map(toPoint);
    let inside=false;
    for(let first=0,second=values.length-1;first<values.length;second=first++){
      const a=values[first],b=values[second];
      const crossing=(a.y>point.y)!==(b.y>point.y)&&point.x<(b.x-a.x)*(point.y-a.y)/(b.y-a.y||1e-9)+a.x;
      if(crossing)inside=!inside;
    }
    return inside;
  }

  function areaBoundary(room){
    if(isOutlineRoom(room))return sampledObjectPoints(room);
    return [{x:room.x,y:room.y},{x:room.x+room.w,y:room.y},{x:room.x+room.w,y:room.y+room.h},{x:room.x,y:room.y+room.h}];
  }

  function pointInArea(point,room){
    if(isOutlineRoom(room))return pointInPolygon(point,areaBoundary(room));
    return point.x>=room.x-EPS&&point.x<=room.x+room.w+EPS&&point.y>=room.y-EPS&&point.y<=room.y+room.h+EPS;
  }

  function nearestAreaBoundary(point,room){return nearestOnPolyline(point,areaBoundary(room),true)}

  function hallwayWidth(hallway){
    if(isPathHallway(hallway))return clamp(normalizeNumber(hallway.widthCells,.75),.5,4)*GRID;
    return hallway.w>=hallway.h?hallway.h:hallway.w;
  }

  function hallwayCenterlines(hallway){
    if(isPathHallway(hallway))return [{points:sampledObjectPoints(hallway),width:hallwayWidth(hallway)}];
    const center={x:hallway.x+hallway.w/2,y:hallway.y+hallway.h/2};
    if(Math.max(hallway.w,hallway.h)/Math.max(GRID,Math.min(hallway.w,hallway.h))<1.35){
      return [
        {points:[{x:hallway.x,y:center.y},{x:hallway.x+hallway.w,y:center.y}],width:hallway.h},
        {points:[{x:center.x,y:hallway.y},{x:center.x,y:hallway.y+hallway.h}],width:hallway.w}
      ];
    }
    return hallway.w>=hallway.h?
      [{points:[{x:hallway.x,y:center.y},{x:hallway.x+hallway.w,y:center.y}],width:hallway.h}]:
      [{points:[{x:center.x,y:hallway.y},{x:center.x,y:hallway.y+hallway.h}],width:hallway.w}];
  }

  function hallwayPorts(hallway){
    const ports=[];
    hallwayCenterlines(hallway).forEach(line=>{
      const points=line.points;
      if(points.length<2)return;
      const first=points[0],firstNext=points[1],last=points[points.length-1],lastPrevious=points[points.length-2];
      const firstLength=Math.max(.001,distance(first,firstNext));
      const lastLength=Math.max(.001,distance(last,lastPrevious));
      ports.push({position:{...first},inward:{x:(firstNext.x-first.x)/firstLength,y:(firstNext.y-first.y)/firstLength},width:line.width});
      ports.push({position:{...last},inward:{x:(lastPrevious.x-last.x)/lastLength,y:(lastPrevious.y-last.y)/lastLength},width:line.width});
    });
    return ports.filter((port,index,array)=>array.findIndex(other=>distance(port.position,other.position)<EPS)===index);
  }

  function nearestOnHallway(point,hallway){
    let best=null;
    hallwayCenterlines(hallway).forEach(line=>{
      const nearest=nearestOnPolyline(point,line.points);
      if(nearest&&(!best||nearest.distance<best.distance))best={...nearest,width:line.width};
    });
    return best;
  }

  function segmentIntersection(first,second){
    const x1=first.start.x,y1=first.start.y,x2=first.end.x,y2=first.end.y;
    const x3=second.start.x,y3=second.start.y,x4=second.end.x,y4=second.end.y;
    const denominator=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
    if(Math.abs(denominator)<1e-6)return null;
    const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/denominator;
    const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/denominator;
    if(t<-.001||t>1.001||u<-.001||u>1.001)return null;
    return {x:x1+t*(x2-x1),y:y1+t*(y2-y1)};
  }

  function detectHallwayArea(hallway,room){
    const ports=hallwayPorts(hallway);
    if(ports.length&&ports.every(port=>pointInArea(port.position,room)))return [];
    return ports.map(port=>{
      const nearest=nearestAreaBoundary(port.position,room);
      if(!nearest)return null;
      const inside=pointInArea(port.position,room);
      const threshold=inside?Math.max(GRID*1.5,port.width*1.35):port.width/2+GRID*.45;
      if(nearest.distance>threshold)return null;
      const angle=normalizeAngle(nearest.tangentAngle);
      return {position:{...nearest.position},angle,orientation:orientationFromAngle(angle),score:140-nearest.distance,
        contact:'threshold'};
    }).filter(Boolean);
  }

  function hasDeepParallelOverlap(first,second){
    const secondLines=hallwayCenterlines(second);
    return hallwayCenterlines(first).some(firstLine=>{
      let overlap=0;
      segmentsFor(firstLine.points).forEach(segment=>{
        const midpoint={x:(segment.start.x+segment.end.x)/2,y:(segment.start.y+segment.end.y)/2};
        let nearest=null;
        secondLines.forEach(line=>{
          const candidate=nearestOnPolyline(midpoint,line.points);
          if(candidate&&(!nearest||candidate.distance<nearest.distance))nearest={...candidate,width:line.width};
        });
        if(nearest&&nearest.distance<Math.min(firstLine.width,nearest.width)*.3&&angleDifference(segment.angle,nearest.tangentAngle)<12){
          overlap+=distance(segment.start,segment.end);
        }
      });
      return overlap>Math.max(GRID*1.5,Math.min(firstLine.width,hallwayWidth(second))*1.25);
    });
  }

  function detectHallwayPair(first,second){
    if(hasDeepParallelOverlap(first,second)||hasDeepParallelOverlap(second,first))return [];
    const candidates=[];
    const examine=(source,target)=>{
      const targetPorts=hallwayPorts(target);
      hallwayPorts(source).forEach(port=>{
        const nearest=nearestOnHallway(port.position,target);
        if(!nearest||nearest.distance>port.width/2+nearest.width/2+GRID*.35)return;
        const sourceAngle=normalizeAngle(Math.atan2(port.inward.y,port.inward.x)*180/Math.PI);
        const parallel=angleDifference(sourceAngle,nearest.tangentAngle)<25;
        const atTargetEnd=targetPorts.some(targetPort=>distance(targetPort.position,nearest.position)<=Math.max(GRID*.55,nearest.width*.65));
        const probe={x:port.position.x+port.inward.x*Math.min(GRID,port.width),y:port.position.y+port.inward.y*Math.min(GRID,port.width)};
        const probeNearest=nearestOnHallway(probe,target);
        const continuesAlongTarget=probeNearest&&probeNearest.distance<=port.width/2+probeNearest.width/2+GRID*.2;
        if(parallel&&!atTargetEnd&&continuesAlongTarget)return;
        const position={x:(port.position.x+nearest.position.x)/2,y:(port.position.y+nearest.position.y)/2};
        const angle=normalizeAngle(sourceAngle+90);
        candidates.push({position,angle,orientation:orientationFromAngle(angle),
          score:(atTargetEnd?145:115)-nearest.distance,contact:atTargetEnd?'endpoint':'junction'});
      });
    };
    examine(first,second);
    examine(second,first);

    const intersections=[];
    hallwayCenterlines(first).forEach(firstLine=>hallwayCenterlines(second).forEach(secondLine=>{
      segmentsFor(firstLine.points).forEach(firstSegment=>segmentsFor(secondLine.points).forEach(secondSegment=>{
        if(angleDifference(firstSegment.angle,secondSegment.angle)<25)return;
        const point=segmentIntersection(firstSegment,secondSegment);
        if(point&&!intersections.some(item=>distance(item.position,point)<GRID*.4)){
          const angle=normalizeAngle(firstSegment.angle+90);
          intersections.push({position:point,angle,orientation:orientationFromAngle(angle),score:108,contact:'crossing'});
        }
      }));
    }));
    if(intersections.length===1)candidates.push(intersections[0]);
    return candidates;
  }

  function structuralRects(object){
    if(!isStructural(object))return [];
    if(object.type==='hallway'&&Array.isArray(object.points)){
      const rects=[];
      for(let index=1;index<object.points.length;index++){
        const a=object.points[index-1],b=object.points[index];
        if(a[0]===b[0]){
          rects.push({x1:a[0]-GRID/2,y1:Math.min(a[1],b[1])-GRID/2,x2:a[0]+GRID/2,
            y2:Math.max(a[1],b[1])+GRID/2,orientation:'vertical',parent:object});
        }else{
          rects.push({x1:Math.min(a[0],b[0])-GRID/2,y1:a[1]-GRID/2,x2:Math.max(a[0],b[0])+GRID/2,
            y2:a[1]+GRID/2,orientation:'horizontal',parent:object});
        }
      }
      return rects;
    }
    return [{x1:object.x,y1:object.y,x2:object.x+object.w,y2:object.y+object.h,
      orientation:object.type==='room'?'area':object.w>=object.h?'horizontal':'vertical',parent:object}];
  }

  function candidateForRectPair(a,b){
    const overlapX=Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1);
    const overlapY=Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1);
    const minSpan=GRID*.5;
    if(Math.abs(a.x2-b.x1)<=EPS&&overlapY>=minSpan){
      return {position:{x:(a.x2+b.x1)/2,y:(Math.max(a.y1,b.y1)+Math.min(a.y2,b.y2))/2},orientation:'vertical',score:120+overlapY,contact:'edge'};
    }
    if(Math.abs(b.x2-a.x1)<=EPS&&overlapY>=minSpan){
      return {position:{x:(b.x2+a.x1)/2,y:(Math.max(a.y1,b.y1)+Math.min(a.y2,b.y2))/2},orientation:'vertical',score:120+overlapY,contact:'edge'};
    }
    if(Math.abs(a.y2-b.y1)<=EPS&&overlapX>=minSpan){
      return {position:{x:(Math.max(a.x1,b.x1)+Math.min(a.x2,b.x2))/2,y:(a.y2+b.y1)/2},orientation:'horizontal',score:120+overlapX,contact:'edge'};
    }
    if(Math.abs(b.y2-a.y1)<=EPS&&overlapX>=minSpan){
      return {position:{x:(Math.max(a.x1,b.x1)+Math.min(a.x2,b.x2))/2,y:(b.y2+a.y1)/2},orientation:'horizontal',score:120+overlapX,contact:'edge'};
    }
    if(overlapX<=EPS||overlapY<=EPS)return null;

    const aHall=a.parent.type==='hallway',bHall=b.parent.type==='hallway';
    if(aHall&&bHall){
      if(a.orientation!==b.orientation){
        return {position:{x:(Math.max(a.x1,b.x1)+Math.min(a.x2,b.x2))/2,
          y:(Math.max(a.y1,b.y1)+Math.min(a.y2,b.y2))/2},
          orientation:a.orientation==='horizontal'?'vertical':'horizontal',score:95+Math.min(overlapX,overlapY),contact:'junction'};
      }
      const horizontal=a.orientation==='horizontal';
      const crossOverlap=horizontal?overlapY:overlapX;
      const aCross=horizontal?a.y2-a.y1:a.x2-a.x1;
      const bCross=horizontal?b.y2-b.y1:b.x2-b.x1;
      const alongOverlap=horizontal?overlapX:overlapY;
      const maxThickness=Math.max(aCross,bCross);
      if(crossOverlap/Math.min(aCross,bCross)>=.7&&alongOverlap<=maxThickness*1.5){
        return {position:{x:(Math.max(a.x1,b.x1)+Math.min(a.x2,b.x2))/2,
          y:(Math.max(a.y1,b.y1)+Math.min(a.y2,b.y2))/2},
          orientation:horizontal?'vertical':'horizontal',score:85+crossOverlap,contact:'junction'};
      }
      return null;
    }

    const hall=aHall?a:b;
    const room=aHall?b:a;
    if(hall.parent.type!=='hallway'||room.parent.type!=='room')return null;
    const thickness=hall.orientation==='horizontal'?hall.y2-hall.y1:hall.x2-hall.x1;
    const maxPenetration=Math.max(GRID,thickness*1.35);
    if(hall.orientation==='horizontal'&&overlapY>=Math.min(thickness,room.y2-room.y1)*.55){
      if(hall.x1<room.x1&&hall.x2>room.x1&&hall.x2-room.x1<=maxPenetration){
        return {position:{x:room.x1,y:(Math.max(hall.y1,room.y1)+Math.min(hall.y2,room.y2))/2},orientation:'vertical',score:105,contact:'threshold'};
      }
      if(hall.x2>room.x2&&hall.x1<room.x2&&room.x2-hall.x1<=maxPenetration){
        return {position:{x:room.x2,y:(Math.max(hall.y1,room.y1)+Math.min(hall.y2,room.y2))/2},orientation:'vertical',score:105,contact:'threshold'};
      }
    }
    if(hall.orientation==='vertical'&&overlapX>=Math.min(thickness,room.x2-room.x1)*.55){
      if(hall.y1<room.y1&&hall.y2>room.y1&&hall.y2-room.y1<=maxPenetration){
        return {position:{x:(Math.max(hall.x1,room.x1)+Math.min(hall.x2,room.x2))/2,y:room.y1},orientation:'horizontal',score:105,contact:'threshold'};
      }
      if(hall.y2>room.y2&&hall.y1<room.y2&&room.y2-hall.y1<=maxPenetration){
        return {position:{x:(Math.max(hall.x1,room.x1)+Math.min(hall.x2,room.x2))/2,y:room.y2},orientation:'horizontal',score:105,contact:'threshold'};
      }
    }
    return null;
  }

  function detectConnectionBetween(first,second,nearPosition=null){
    if(!isStructural(first)||!isStructural(second))return null;
    if(first.type!=='hallway'&&second.type!=='hallway')return null;
    const firstBounds=objectBounds(first),secondBounds=objectBounds(second),reach=GRID*1.75;
    if(firstBounds.x2+reach<secondBounds.x1||secondBounds.x2+reach<firstBounds.x1||
      firstBounds.y2+reach<secondBounds.y1||secondBounds.y2+reach<firstBounds.y1)return null;
    let candidates=[];
    const usesPointGeometry=isEditableShape(first)||isEditableShape(second);
    if(!usesPointGeometry){
      structuralRects(first).forEach(a=>structuralRects(second).forEach(b=>{
        const candidate=candidateForRectPair(a,b);
        if(candidate)candidates.push(candidate);
      }));
    }else if(first.type==='hallway'&&second.type==='hallway'){
      candidates=detectHallwayPair(first,second);
    }else{
      const hallway=first.type==='hallway'?first:second;
      const room=first.type==='room'?first:second;
      candidates=detectHallwayArea(hallway,room);
    }
    if(!candidates.length)return null;
    candidates=candidates.map(candidate=>{
      const angle=normalizeAngle(candidate.angle??(candidate.orientation==='vertical'?90:0));
      return {...candidate,angle,orientation:orientationFromAngle(angle)};
    });
    candidates.sort((a,b)=>{
      if(nearPosition)return distance(a.position,nearPosition)-distance(b.position,nearPosition)||b.score-a.score;
      return b.score-a.score;
    });
    return candidates[0];
  }

  function connectionExistsBetween(firstId,secondId,position){
    return state.connections.some(connection=>{
      const samePair=(sameId(connection.fromObjectId,firstId)&&sameId(connection.toObjectId,secondId))||
        (sameId(connection.fromObjectId,secondId)&&sameId(connection.toObjectId,firstId));
      return samePair&&distance(connection.position,position)<GRID*1.5;
    });
  }

  function discoverConnectionsFor(object){
    if(!isStructural(object))return [];
    return state.objects.filter(other=>!sameId(other.id,object.id)&&other.floorId===object.floorId&&isStructural(other))
      .map(other=>{
        const detected=detectConnectionBetween(object,other);
        return detected&&!connectionExistsBetween(object.id,other.id,detected.position)?{
          fromObjectId:object.id,toObjectId:other.id,floorId:object.floorId,...detected
        }:null;
      }).filter(Boolean);
  }

  function validateConnection(connection,moveLinkedDoor=true){
    const from=getObject(connection.fromObjectId),to=getObject(connection.toObjectId);
    if(!from||!to){connection.status='invalid';connection.reason='Connected object is missing';return false}
    const detected=detectConnectionBetween(from,to,connection.position);
    if(!detected){connection.status='invalid';connection.reason='Connected geometry no longer meets';return false}
    const linkedDoor=getObject(connection.doorObjectId);
    if(linkedDoor&&!moveLinkedDoor){
      const closeEnough=distance({x:linkedDoor.x,y:linkedDoor.y},detected.position)<=GRID*.75;
      const angleMatches=angleDifference(linkedDoor.angle??(linkedDoor.orientation==='vertical'?90:0),detected.angle)<=5;
      if(!closeEnough||!angleMatches){
        connection.status='invalid';
        connection.reason='Door moved away from its connection';
        return false;
      }
    }
    connection.position={...detected.position};
    connection.angle=detected.angle;
    connection.orientation=detected.orientation;
    connection.contact=detected.contact;
    connection.status='valid';
    connection.reason='';
    if(linkedDoor&&moveLinkedDoor){
      linkedDoor.x=detected.position.x;
      linkedDoor.y=detected.position.y;
      linkedDoor.angle=detected.angle;
      linkedDoor.orientation=detected.orientation;
    }
    return true;
  }

  function revalidateConnectionsForObject(objectId){
    let invalidCount=0;
    state.connections.filter(connection=>sameId(connection.fromObjectId,objectId)||sameId(connection.toObjectId,objectId)||
      sameId(connection.doorObjectId,objectId)).forEach(connection=>{
        const movingDoor=sameId(connection.doorObjectId,objectId);
        if(!validateConnection(connection,!movingDoor))invalidCount++;
      });
    return invalidCount;
  }

  function validateAllConnections(){
    state.connections.forEach(connection=>validateConnection(connection,false));
  }

  function beginConnectionPrompts(candidates){
    connectionQueue=candidates;
    connectionQueueTotal=candidates.length;
    openNextConnectionPrompt();
  }

  function openNextConnectionPrompt(){
    if(!connectionQueue.length){
      const object=selected();
      connectionQueueTotal=0;
      render();
      if(object)openObjectSheet();
      return;
    }
    const candidate=connectionQueue[0];
    const from=getObject(candidate.fromObjectId),to=getObject(candidate.toObjectId);
    const completed=connectionQueueTotal-connectionQueue.length+1;
    document.getElementById('connectionProgress').textContent=`Connection ${completed} of ${connectionQueueTotal}`;
    document.getElementById('connectionText').textContent=`${objectDisplayName(from)} meets ${objectDisplayName(to)}. How should they connect?`;
    showSheetSection(connectionPicker,'Smart Connection');
  }

  function applyConnectionChoice(choice){
    const candidate=connectionQueue.shift();
    if(!candidate)return;
    if(choice!=='separate'){
      const connection={
        id:nextConnectionId(),type:choice,floorId:candidate.floorId,
        fromObjectId:candidate.fromObjectId,toObjectId:candidate.toObjectId,
        position:{...candidate.position},angle:candidate.angle,orientation:candidate.orientation,contact:candidate.contact,
        doorObjectId:null,status:'valid',reason:''
      };
      if(choice==='door'||choice==='secret-door'){
        const door={
          id:nextId(),type:'door',floorId:candidate.floorId,x:candidate.position.x,y:candidate.position.y,
          angle:candidate.angle,orientation:candidate.orientation,doorType:choice,connectionId:connection.id,generatedByConnection:true,
          label:'',notes:''
        };
        state.objects.push(door);
        connection.doorObjectId=door.id;
      }
      state.connections.push(connection);
    }
    render();
    openNextConnectionPrompt();
  }

  function addTextLabel(group,object,x,y){
    if(!object.label)return;
    const text=svgEl('text',{x,y,fill:'#1e1d1a','font-size':13,'pointer-events':'none'});
    text.textContent=object.label;
    group.appendChild(text);
  }

  function renderStructure(object){
    const group=svgEl('g',{'data-id':object.id,'data-object-type':object.type,style:'cursor:pointer'});
    const isSelected=sameId(object.id,selectedId);
    if(isOutlineRoom(object)){
      const data=curvePathData(object.points,true);
      group.appendChild(svgEl('path',{d:data,fill:'#f7f3e8',stroke:isSelected?'#7a5c20':'#1e1d1a',
        'stroke-width':isSelected?5:3,'stroke-linejoin':'round'}));
      const bounds=objectBounds(object);
      addTextLabel(group,object,bounds.x1+10,bounds.y1+20);
    }else if(object.type==='room'){
      group.appendChild(svgEl('rect',{x:object.x,y:object.y,width:object.w,height:object.h,fill:'#f7f3e8',
        stroke:isSelected?'#7a5c20':'#1e1d1a','stroke-width':isSelected?5:3}));
      addTextLabel(group,object,object.x+8,object.y+18);
    }else if(isPathHallway(object)){
      const curved=object.pathStyle==='curved'||object.smoothing==='curve';
      const data=curved?curvePathData(object.points):`M ${object.points.map(point=>point.join(' ')).join(' L ')}`;
      const width=hallwayWidth(object);
      const linecap=curved?'round':'square',linejoin=curved?'round':'miter';
      group.appendChild(svgEl('path',{d:data,fill:'none',stroke:'transparent','stroke-width':Math.max(width+24,44),
        'stroke-linecap':linecap,'stroke-linejoin':linejoin}));
      group.appendChild(svgEl('path',{d:data,fill:'none',stroke:isSelected?'#7a5c20':'#1e1d1a','stroke-width':width+(isSelected?10:7),
        'stroke-linecap':linecap,'stroke-linejoin':linejoin,'pointer-events':'none'}));
      group.appendChild(svgEl('path',{d:data,fill:'none',stroke:'url(#hallwayHatch)','stroke-width':width,
        'stroke-linecap':linecap,'stroke-linejoin':linejoin,'pointer-events':'none'}));
      if(object.label){
        const first=object.points[0];
        addTextLabel(group,object,first[0]+10,first[1]-width/2-8);
      }
    }else{
      group.appendChild(svgEl('rect',{x:object.x,y:object.y,width:object.w,height:object.h,fill:'url(#hallwayHatch)',
        stroke:isSelected?'#7a5c20':'#1e1d1a','stroke-width':isSelected?5:3}));
      addTextLabel(group,object,object.x+8,object.y+18);
    }
    structuresLayer.appendChild(group);
  }

  function linePointsAtAngle(x,y,angle,length){
    const radians=normalizeAngle(angle)*Math.PI/180;
    const dx=Math.cos(radians)*length/2,dy=Math.sin(radians)*length/2;
    return {x1:x-dx,y1:y-dy,x2:x+dx,y2:y+dy};
  }

  function linePoints(x,y,orientation,length){
    return linePointsAtAngle(x,y,orientation==='vertical'?90:0,length);
  }

  function renderConnections(){
    connectionsLayer.innerHTML='';
    state.connections.filter(c=>c.floorId===state.activeFloorId).forEach(connection=>{
      const {x,y}=connection.position;
      if(connection.status==='invalid'){
        connectionsLayer.appendChild(svgEl('circle',{cx:x,cy:y,r:11,fill:'#fffdf8',stroke:'#a33a31','stroke-width':3,'stroke-dasharray':'4 3','pointer-events':'none'}));
        const mark=svgEl('text',{x,y:y+5,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#a33a31','pointer-events':'none'});
        mark.textContent='!';
        connectionsLayer.appendChild(mark);
      }else if(connection.type==='open-passage'){
        const angle=connection.angle??(connection.orientation==='vertical'?90:0);
        const points=linePointsAtAngle(x,y,angle,GRID*.8);
        connectionsLayer.appendChild(svgEl('line',{...points,stroke:'#fffdf8','stroke-width':9,'stroke-linecap':'square','pointer-events':'none'}));
        const cap1=linePointsAtAngle(points.x1,points.y1,angle+90,8);
        const cap2=linePointsAtAngle(points.x2,points.y2,angle+90,8);
        connectionsLayer.appendChild(svgEl('line',{...cap1,stroke:'#1e1d1a','stroke-width':2,'pointer-events':'none'}));
        connectionsLayer.appendChild(svgEl('line',{...cap2,stroke:'#1e1d1a','stroke-width':2,'pointer-events':'none'}));
      }
    });
  }

  function renderDoor(object){
    const group=svgEl('g',{'data-id':object.id,'data-object-type':'door',style:'cursor:pointer'});
    const selectedDoor=sameId(object.id,selectedId);
    const connection=object.connectionId!==null?state.connections.find(c=>sameId(c.id,object.connectionId)):null;
    const invalid=connection&&connection.status==='invalid';
    const angle=object.angle??(object.orientation==='vertical'?90:0);
    const points=linePointsAtAngle(object.x,object.y,angle,28);
    group.appendChild(svgEl('line',{...points,stroke:'transparent','stroke-width':30}));
    group.appendChild(svgEl('line',{...points,stroke:invalid?'#a33a31':selectedDoor?'#7a5c20':'#1e1d1a','stroke-width':6,
      'stroke-dasharray':object.doorType==='secret-door'?'7 4':null,'pointer-events':'none'}));
    if(object.doorType==='secret-door'){
      const secret=svgEl('text',{x:object.x+7,y:object.y-7,'font-size':11,'font-weight':800,fill:invalid?'#a33a31':'#1e1d1a','pointer-events':'none'});
      secret.textContent='S';
      group.appendChild(secret);
    }
    addTextLabel(group,object,object.x+10,object.y+19);
    detailsLayer.appendChild(group);
  }

  function renderMarker(object){
    const group=svgEl('g',{'data-id':object.id,'data-object-type':'marker',style:'cursor:pointer'});
    const isSelected=sameId(object.id,selectedId);
    group.appendChild(svgEl('circle',{cx:object.x,cy:object.y,r:17,fill:'#f7f3e8',stroke:isSelected?'#7a5c20':'#1e1d1a','stroke-width':isSelected?5:3}));
    const glyph=svgEl('text',{x:object.x,y:object.y+5,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#1e1d1a','pointer-events':'none'});
    glyph.textContent=markerCatalog[object.markerType]?.glyph||'?';
    group.appendChild(glyph);
    addTextLabel(group,object,object.x+23,object.y+5);
    detailsLayer.appendChild(group);
  }

  function renderEditHandles(){
    if(!handlesLayer)return;
    handlesLayer.innerHTML='';
    const object=getObject(editingShapeId);
    if(!object||!isEditableShape(object))return;
    const radius=8/viewport.zoom,strokeWidth=2/viewport.zoom;
    object.points.forEach((point,index)=>{
      const endpoint=isPathHallway(object)&&(index===0||index===object.points.length-1);
      handlesLayer.appendChild(svgEl('circle',{cx:point[0],cy:point[1],r:radius,
        fill:endpoint?'#7a5c20':'#fffdf8',stroke:'#1e1d1a','stroke-width':strokeWidth,
        'data-id':object.id,'data-handle-index':index,style:'cursor:grab'}));
    });
  }

  function render(){
    structuresLayer.innerHTML='';
    detailsLayer.innerHTML='';
    activeFloorObjects().filter(isStructural).forEach(renderStructure);
    renderConnections();
    activeFloorObjects().filter(o=>o.type==='door').forEach(renderDoor);
    activeFloorObjects().filter(o=>o.type==='marker').forEach(renderMarker);
    renderEditHandles();
    scheduleAutosave();
  }

  function previewRectangle(start,end,kind){
    previewLayer.innerHTML='';
    const hallway=kind==='hallway';
    previewLayer.appendChild(svgEl('rect',{x:Math.min(start.x,end.x),y:Math.min(start.y,end.y),
      width:Math.abs(end.x-start.x),height:Math.abs(end.y-start.y),
      fill:hallway?'url(#hallwayHatch)':'rgba(122,92,32,.08)',opacity:hallway?.9:1,
      stroke:'#7a5c20','stroke-width':3,'stroke-dasharray':hallway?'4 4':'8 6'}));

  function previewFreehand(points,kind){
    previewLayer.innerHTML='';
    if(points.length<2)return;

    if(kind==='hallway'){

        'stroke-linecap':'round','stroke-linejoin':'round',opacity:.9}));
