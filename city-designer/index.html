function layersPanel(){let html=block('Visible map layers',`<p class="hint">Visibility affects only this editor and the live canvas. Exported JSON always contains all objects; exported PNG shows all layers.</p>`+CATEGORIES.map(k=>`<label class="layer"><span><span class="icon">${{terrain:'⌃',districts:'⬡',streets:'≋',squares:'▱',walls:'▥',buildings:'▣',landmarks:'♜',people:'♟',markers:'⚑'}[k]}</span> ${niceName(k)} <i>${city[k].length}</i></span><input type="checkbox" data-layer="${k}" ${visible[k]?'checked':''}></label>`).join(''));

function warningsPanel(){const total=warns.length;let out=`<div class="notice">Warnings are design guidance, not automatic changes. Selecting one will centre the relevant object. ${total>=MAX_WARN?'Only the first '+MAX_WARN+' warnings are shown.':''}</div>`;if(!total)out+=`<div class="notice" style="background:#eaf1e8;border-color:#aecab0;color:#3f6448">✓ No geometry warnings detected at this stage. Manual review is still recommended.</div>`;
 else out+=`<p class="hint">${total} issue${total===1?'':'s'} detected · ${warns.filter(o=>o.critical).length} collisions or missing data</p><div class="warning-list">${warns.map((w,i)=>`<button class="warning ${w.critical?'critical':''}" data-warning="${i}"><b>${w.critical?'●':'⚑'} ${esc(w.title)}</b>${esc(w.description)}</button>`).join('')}</div>`;

function toolHint(){const txt={pan:'Drag to pan the map. Pinch with two fingers on a phone.',building:'Drag from one corner to the opposite to create a building. New buildings face north by default.',street:'Tap vertices to draw a street centreline, then Finish. Width and surface can be edited afterward.',square:'Tap corners of a plaza, then Finish to close it.',district:'Tap boundary vertices, then Finish to close the district.',terrain:'Tap points around the terrain boundary, then Finish.',wall:'Tap points along a city wall, then Finish. Select it to add towers and gates.',landmark:'Tap to place a landmark. Change the type to spire, keep, well, fountain, tree, and more.',person:'Tap to place an NPC. Select it to change the ID or turn it into a crowd.',marker:'Tap to place a note. Select it to choose spawn, quest, travel, or another marker.',gate:'Tap a wall line to place a gate.',tower:'Tap a wall line to place a tower.',route:'Tap to draw a patrol route, then Finish.',insertVertex:'Tap a segment of the selected shape to insert a new editable point.',removeVertex:'Tap a vertex to remove it without deleting the shape.'}[tool];return txt?`<div class="notice">${esc(txt)}</div>`:''}
function refreshPanel(){const current=$('panel');const s=sel[0],kind=sel.length===1?niceName(s.kind):sel.length>1?`${sel.length} objects`:'City overview';$('panelTitle').textContent=kind;

 $('warningCount').textContent=warns.length?String(warns.length):'';document.querySelectorAll('.tab').forEach(a=>a.classList.toggle('active',a.dataset.tab===tab));$('canvasTitle').textContent=city.name;$('project-title').textContent=city.name}

function readPath(o,path){if(!path)return undefined;return path.split('.').reduce((v,k)=>v?.[k],o)}
function writePath(o,path,value){const parts=path.split('.');const last=parts.pop();let cur=o;for(const k of parts){if(!cur[k]||typeof cur[k]!=='object')cur[k]={};cur=cur[k]}cur[last]=value}
function fieldUpdate(el){const scope=el.dataset.editor,path=el.dataset.field;if(!scope||scope==='readonly'||!path)return;
 let value=el.type==='checkbox'?el.checked:el.value;
 if(el.type==='number'){if(value.trim()==='')return;value=Number(value);if(!Number.isFinite(value))return}
 if(scope==='fill'){fillSettings[path]=value;return}
 if(scope==='special'&&path==='represent'){const s=sel[0],p=findRef(s);if(!p)return;mutate(()=>{if(value==='crowd'){delete p.npc;delete p.route;delete p.loop;delete p.facing;delete p.x;delete p.y;p.crowd=10;p.area=city.squares[0]?.id||city.districts[0]?.id||''}else{delete p.crowd;delete p.area;p.npc='unnamed_npc';p.x=0;p.y=0;p.facing=0}});return}
 if(scope==='special'&&path==='loop'){const p=findRef(sel[0]);if(!p)return;mutate(()=>{p.loop=value==='yes'});return}
 const target=scope==='project'?city:scope==='background'?city.background:findRef(sel[0]);if(!target)return;
 if(scope==='project'&&path==='id'&&!String(value).trim()){toast('City ID cannot be empty');refreshPanel();return}
 if(scope==='object'&&['w','d','width','thickness','radius','edge','height','storeys'].includes(path)&&typeof value==='number'&&value<0){toast('Dimensions cannot be negative');refreshPanel();return}
 if(scope==='object'&&path==='interior'&&value===''){
 mutate(()=>{delete target.interior});return
 }
 if(scope==='object'&&path==='tags')value=String(value).split(',').map(s=>s.trim()).filter(Boolean);
 if(scope==='object'&&['facing'].includes(path))value=degree(value);
 if(scope==='background'&&['w','h'].includes(path))value=Math.max(1,n(value,1));
 if(JSON.stringify(readPath(target,path))===JSON.stringify(value))return;
 mutate(()=>{writePath(target,path,value)});
}
function candidateClear(b,all,chosenStreet){const bp=rectPoly(b);
for(const other of all)if(convexOverlap(bp,rectPoly(other),n(fillSettings.gap,.8)))return false;
for(const sq of city.squares){if((sq.polygon||[]).length>2&&polygonsOverlap(bp,(sq.polygon||[]).map(point)))return false}
for(const l of city.landmarks){if(polygonsOverlap(bp,landPoly(l)))return false}
for(const st of city.streets){const line=(st.points||[]).map(point);const roadHalf=n(st.width,6)/2;for(const [a,c] of polyEdges(line,false)){if(polySegDist(bp,a,c)<roadHalf+.2)return false}}
for(const wall of city.walls){const ps=(wall.points||[]).map(point);for(const [a,c] of polyEdges(ps,!!wall.closed))if(polySegDist(bp,a,c)<n(wall.thickness,3)/2+1)return false}
const closed=city.walls.filter(w=>w.closed&&w.points?.length>2);if(closed.length&&!closed.some(w=>bp.every(p=>inPoly(p,w.points.map(point)))))return false;
return true}
function fillStreet(){const s=sel[0],st=s&&s.kind==='streets'?findRef(s):null;if(!st){toast('Select a street first.');return}
 const cfg=fillSettings,low=clamp(n(cfg.minWidth,6),3,30),high=clamp(n(cfg.maxWidth,10),low,30),minD=clamp(n(cfg.minDepth,7),3,30),maxD=clamp(n(cfg.maxDepth,10),minD,30),gap=clamp(n(cfg.gap,1.2),0,10),edge=clamp(n(cfg.edge,1),.3,1.5),sides=cfg.side==='both'?[-1,1]:[cfg.side==='left'?1:-1];
 const list=[],pts=(st.points||[]).map(point);let skipped=0,counter=0;
 for(let z=0;z<pts.length-1;z++){const a=pts[z],end=pts[z+1],len=dist(a,end);if(len<low+8)continue;const tangent=norm(sub(end,a)),left={x:-tangent.y,y:tangent.x};for(const side of sides){const normal=mul(left,side);let advance=4+low/2;
 while(advance+low/2<len-4){const variation=Math.sin((z+1)*46.33+advance*17.9+side*2.13),w=snap(clamp(low+(variation+1)/2*(high-low),low,high)),d=snap(clamp(minD+(Math.cos(advance*11.52+z*4.12)+1)/2*(maxD-minD),minD,maxD));
 const width=Math.max(low,w),depth=Math.max(minD,d);if(advance+width/2>len-3)break;const base=add(a,mul(tangent,advance)),c=add(base,mul(normal,n(st.width,6)/2+edge+depth/2));const facing=compass(-normal.x,-normal.y);const b={id:'',x:snap(c.x),y:snap(c.y),w:width,d:depth,facing,storeys:1+(counter%3===0?1:0),walls:cfg.walls,roof:cfg.roof,district:'',door:{offset:0},enterable:false,sign:'',lit:(counter%3!==0),attached:gap<.3,tags:[]};const district=city.districts.find(x=>inPoly({x:b.x,y:b.y},(x.polygon||[]).map(point)));if(district){b.district=district.id;if(district.mood==='rough'){b.walls='rough';b.roof='slate';b.lit=counter%5===0}else if(district.mood==='poor'){b.walls='timber';b.roof='thatch';b.lit=counter%6===0}else if(district.mood==='rich'){b.walls='stone';b.roof='slate';b.lit=true}else if(district.mood==='busy')b.lit=counter%5!==0}
 if(candidateClear(b,[...city.buildings,...list],st)){list.push(b)}else skipped++;advance+=width+gap;counter++;
 if(counter>1200)break
 }}}
 if(!list.length){toast('No room found. Try a longer road, narrower buildings or a different side.');return}
 mutate(()=>{for(const b of list){b.id=makeId('b');city.buildings.push(b)}});toast(`${list.length} buildings added; ${skipped} positions skipped for obstacles. Undo removes all.`);
}
function applyRawObject(){const s=sel[0],o=findRef(s);if(!o)return;let value;try{value=JSON.parse($('advancedText').value)}catch(e){toast('Invalid object JSON: '+e.message);return}if(!value||typeof value!=='object'||Array.isArray(value)||value.id!==o.id){toast('The object must remain an object with its original ID.');return}
 mutate(()=>{if(s.kind==='gate'||s.kind==='tower'){const p=findObj('walls',s.parent),k=s.kind==='gate'?'gates':'towers',i=p[k].findIndex(x=>x.id===s.id);p[k][i]=value}else{const arr=city[s.kind],ix=arr.findIndex(x=>x.id===s.id);arr[ix]=value}});toast('Advanced JSON updated. Unrecognized fields are retained.')}

function runAction(action){switch(action){case'duplicate':duplicate();break;case'delete':deleteSelection();break;case'focus':if(sel[0])focusRef(sel[0]);break;case'fit':fitView();break;case'snap':toggleSnap();break;case'placeGate':wallPartMode('gate');break;case'placeTower':wallPartMode('tower');break;case'route':if(sel[0]?.kind==='people'){const o=findRef(sel[0]);if(o?.npc){routeTarget={...sel[0]};setTool('route');routeTarget=ref('people',o.id);toast('Tap route points; select Finish when done.')}else toast('Only named NPCs have patrol routes.')}break;
 case'fillStreet':fillStreet();break;case'insertVertex':case'removeVertex':if(sel.length===1){const chosen={...sel[0]};setTool(action);vertexTarget=chosen;toast(action==='insertVertex'?'Tap the line segment where you want a new vertex.':'Tap a square vertex to remove it.')}break;case'applyRaw':applyRawObject();break;case'background':$('bgInput').click();break;case'exportBackground':exportBackground();break;case'clearBackground':mutate(()=>{delete city.background;bgImage=null;bgName='';bgDataUrl=''});toast('Tracing image removed.');break;case'help':showHelp();break;case'showAll':visible={...DEFAULT_VISIBLE};scheduleSave();refreshPanel();render();break;}}

async function loadJsonText(textContent){let raw;try{raw=JSON.parse(textContent);raw=normalizeCity(raw)}catch(e){toast(e.message);return false}
 const ids=new Set();for(const k of CATEGORIES){for(const o of raw[k]){if(!o.id||ids.has(String(o.id))){toast(`Missing or duplicate object ID in ${k}. Import cancelled.`);return false}ids.add(String(o.id));if(k==='walls')for(const t of [...(o.towers||[]),...(o.gates||[])]){if(!t.id||ids.has(String(t.id))){toast('Duplicate or missing tower/gate ID.');return false}ids.add(String(t.id))}}}

function openModal(title,desc,value,mode){modalMode=mode;$('modalTitle').textContent=title;$('modalDesc').textContent=desc;$('modalText').value=value;$('modalText').readOnly=mode==='help';$('modalApply').hidden=mode==='help';$('modalBack').classList.add('show')}

function showHelp(){openModal('A small atlas, built to last',`Offline · Your edits autosave in this browser. Export both JSON and PNG for Claude. Objects use stable IDs and map coordinates (metres, north up).`,`START HERE\n\n1. Use HighSpire's scaffold, or create a new settlement from the ••• menu.\n2. Choose Building, tap one corner, tap the opposite corner, then select Finish. Its properties open immediately so you can name it, add notes, and edit dimensions, facing, door offset and materials.\n3. For Street, Square, Wall, Terrain and District, tap consecutive points and select Finish. Select any shape and drag its square vertex handles to fine-tune.\n4. Select a street to Fill Street with buildings, avoiding roads, walls, plazas and existing buildings. Insert or remove vertices from selected roads and polygons using the Properties panel.\n5. Select a defensive wall to add gates and towers.\n6. Use People to place NPCs. Select an NPC to draw a patrol route, or switch to a crowd attached to a square or district.\n7. Open Warnings for road connectivity, building collisions, front door access, city walls and the game's content budget. Click a warning to select and centre the object.\n8. Export city JSON and a matching PNG. Keep both files together for Claude.\n\nCONTROLS\nMouse wheel: zoom under pointer\nMiddle button, right button, Alt+drag, or Pan: move view\nTouch: one finger draws/selects; two fingers pan and pinch to zoom\nShift+click: multi-select; Shift+drag empty space: selection box\nV: Select · H: Pan · B: Building · S: Street\nEnter: finish a road or polygon · Escape: cancel a drawing\nCtrl/Cmd+D: duplicate · Delete: remove selected\nCtrl/Cmd+Z: undo · Ctrl/Cmd+Shift+Z: redo\n[ and ]: rotate a selected building 15°\n\nFORMAT\ndescendence-city JSON v1 · x east · y north · facing 0° north, 90° east\nUnknown JSON fields are retained during import and export.\n\nLIMITATIONS\nThe checker uses conservative 2D geometric approximations. It cannot replace a 3D path function openDb(){return new Promise(resolve=>{if(!window.indexedDB){resolve(null);return}const req=indexedDB.open('DescendenceCityImages',1);req.onupgradeneeded=()=>{req.result.createObjectStore('backgrounds')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)})}
